<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet">
  <!-- 深色背景 -->
  <rect width="400" height="500" fill="#0e1a22"/>

  <!-- 微弱的光晕，象征被光照亮的画 -->
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#3a4a5a" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#1a2630" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="500" fill="url(#glow)"/>

  <!-- 外框 -->
  <rect x="90" y="120" width="220" height="280" fill="none" stroke="#d8c89a" stroke-width="2" opacity="0.85"/>
  <rect x="100" y="130" width="200" height="260" fill="#15212b" stroke="#d8c89a" stroke-width="1" opacity="0.9"/>

  <!-- 画内抽象内容：山脉与海的极简构图 -->
  <line x1="115" y1="320" x2="285" y2="320" stroke="#7a8a9a" stroke-width="1.2" opacity="0.7"/>
  <polyline points="115,320 160,260 195,290 235,235 285,280 285,380 115,380"
            fill="#1c2a36" stroke="#9aaabc" stroke-width="1.2" opacity="0.85"/>
  <circle cx="260" cy="180" r="22" fill="#d8c89a" opacity="0.35"/>

  <!-- 物品标签 -->
  <text x="200" y="450" text-anchor="middle" fill="#d8c89a" opacity="0.7" font-family="serif" font-size="16" letter-spacing="6">画 · 一幅未完成的临摹</text>
  <text x="200" y="475" text-anchor="middle" fill="#7a8a9a" opacity="0.6" font-family="serif" font-size="11" letter-spacing="2">THE PAINTING · PLACEHOLDER</text>
</svg>
