<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet">
  <rect width="400" height="500" fill="#0e1a22"/>

  <radialGradient id="glow" cx="50%" cy="55%" r="50%">
    <stop offset="0%" stop-color="#3a4a5a" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#1a2630" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="500" fill="url(#glow)"/>

  <!-- 杯子轮廓，杯口有缺口 -->
  <g transform="translate(200 270)">
    <!-- 杯身 -->
    <path d="M -55 -70 L -50 80 L 50 80 L 55 -70 Z"
          fill="#1c2a36" stroke="#d8c89a" stroke-width="1.8" opacity="0.9"/>

    <!-- 把手 -->
    <path d="M 55 -30 Q 90 -10 85 30 Q 80 55 55 50"
          fill="none" stroke="#d8c89a" stroke-width="1.8" opacity="0.9"/>

    <!-- 杯口椭圆 -->
    <ellipse cx="0" cy="-70" rx="55" ry="10" fill="#0e1a22" stroke="#d8c89a" stroke-width="1.8"/>

    <!-- 缺口：用与背景同色的小三角覆盖 -->
    <polygon points="-25,-75 -5,-72 -15,-65" fill="#0e1a22"/>
    <polygon points="-25,-75 -5,-72 -15,-65" fill="none" stroke="#d8c89a" stroke-width="0.8" opacity="0.4"/>

    <!-- 杯内液面 -->
    <ellipse cx="0" cy="-65" rx="48" ry="7" fill="#3a2a1a" opacity="0.5"/>
    <ellipse cx="0" cy="-65" rx="48" ry="7" fill="none" stroke="#d8c89a" stroke-width="0.6" opacity="0.4"/>

    <!-- 高光 -->
    <line x1="-35" y1="-50" x2="-40" y2="60" stroke="#d8c89a" stroke-width="0.6" opacity="0.3"/>
  </g>

  <text x="200" y="430" text-anchor="middle" fill="#d8c89a" opacity="0.7" font-family="serif" font-size="16" letter-spacing="6">缺口杯 · 没舍得扔的那只</text>
  <text x="200" y="455" text-anchor="middle" fill="#7a8a9a" opacity="0.6" font-family="serif" font-size="11" letter-spacing="2">THE CUP · PLACEHOLDER</text>
</svg>
